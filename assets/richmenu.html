<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:2500px;height:843px;display:flex;background:#f4ecd8;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:#2b2b2b;overflow:hidden}
.b{width:calc(100%/3);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border-top:28px solid var(--c);}
.b+.b{border-left:6px dashed #b9a98a}
.b:nth-child(1){--c:#c8382b;background:#f6eedb}
.b:nth-child(2){--c:#2f5d46;background:#efe8d0}
.b:nth-child(3){--c:#b8862b;background:#f6eedb}
.i{font-size:200px;line-height:1;margin-bottom:20px}
.t{font-size:96px;font-weight:800;color:var(--c);letter-spacing:.04em}
.s{font-size:52px;font-weight:600;margin-top:18px;color:#5a4a36}
.s:empty{display:none}
</style></head><body>
<div class="b"><div class="i">📍</div><div class="t">記録・検索</div><div class="s">位置情報を送る</div></div>
<div class="b"><div class="i">🗺</div><div class="t">地図を見る</div><div class="s">&nbsp;</div></div>
<div class="b"><div class="i">🔗</div><div class="t">地図を共有</div><div class="s">QRコード</div></div>
</body></html>
