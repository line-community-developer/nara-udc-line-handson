title: "LINEでまちの記憶アーカイブBotを作ろう - 奈良のまちの記録を集める LINE Bot × GAS ハンズオン"
summary: |
  まちで見つけた気になる場所を LINE でワンタップ登録し、GPS で近い場所を
  検索したり、地図で公式データと見比べたりできる「まちの記憶アーカイブBot」を、
  LINE Messaging API × Google Apps Script で作る 5 時間のハンズオン資料です。
  奈良の URBAN DATA CHALLENGE（UDC）コラボ企画の教材です。

  ■ 作るもの
  ・現在地を送るだけで場所を登録できる LINE Bot
  ・緯度経度から登録済みの場所を近い順に検索する GPS 検索機能
  ・ユーザーごとの状態管理と、シートで増やせる質問
  ・写真アップロード／FlexMessage（登録完了カード）／リッチメニュー／
    マップ表示（写真・公式データつき）／QRコード（地図の共有）／
    登録一覧・削除から選べるもくもくタイム

  ■ おすすめしたい人
  ・LINE Bot は作ったことがあるが、複数ターンの会話（状態管理）は未経験
  ・GAS でサーバーレスに Bot を作ってみたい

